version: '3.9'

services:
  epubkit:
    build:
      context: .
      dockerfile: Dockerfile
    image: epubkit:latest
    container_name: epubkit
    restart: unless-stopped
    ports:
      - "8123:8000"
    volumes:
      # NAS bind mounts for persistent file access
      - /share/Docker/epubkit/uploads:/app/tmp/uploads
      - /share/Docker/epubkit/outputs:/app/tmp/outputs
    environment:
      - TZ=America/Toronto
